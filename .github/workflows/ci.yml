name: CI

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimal deps (fast CI)
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest python-dotenv pandas backtesting

      - name: Ruff (lint)
        run: ruff check config.py bot.py tests/

      - name: Ruff (format check)
        run: ruff format --check config.py bot.py tests/

      - name: Pytest
        env:
          T_INVEST_TOKEN: dummy
          TELEGRAM_BOT_TOKEN: dummy
        run: pytest -q